name: Lean

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Lean project
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: GenLimitLean

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Download Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build

      - name: Check theorem axiom allowlist
        run: lake env lean Audit.lean

      - name: Scan Lean files for unfinished proofs
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --include='*.lean' \
            '(^|[^[:alnum:]_])(sorry|admit|sorryAx|axiom)([^[:alnum:]_]|$)' \
            GenLimit.lean Audit.lean GenLimit; then
            echo 'Found an unfinished proof or project axiom.' >&2
            exit 1
          fi
